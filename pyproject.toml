[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptrace-swe"
version = "1.3.0"
description = "Trajectory-aware evaluation for software engineering agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
source = ["tree-sitter==0.25.2", "tree-sitter-go==0.25.0", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2"]
figures = ["matplotlib>=3.7,<4", "numpy>=1.24,<3"]
sampling = ["scipy>=1.11,<2"]

[project.scripts]
ptrace = "ptrace.cli:main"

[tool.setuptools.packages.find]
include = ["ptrace*"]

[tool.setuptools.package-data]
ptrace = ["prompt_templates/*.txt"]
